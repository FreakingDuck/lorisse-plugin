[package]
name = "lorisse"
version = "0.8.0"
edition = "2021"
description = "Lorisse's plugin program: an MCP server over stdio with five reading tools, where, plop, search, read, links, and thirteen writing tools, remember, note, link, attach, undo, start, import, change, retire, journal, drawer, move, rule"
publish = false

[[bin]]
name = "lorisse"
path = "src/main.rs"

[dependencies]
lorisse-store = { path = "../store" }
lorisse-guard = { path = "../guard" }
