[package]
name = "lorisse"
version = "0.5.0"
edition = "2021"
description = "Lorisse's plugin program: an MCP server over stdio with five reading tools, where, plop, search, read, links, and seven writing tools, remember, note, link, attach, undo, start, import"
publish = false

[[bin]]
name = "lorisse"
path = "src/main.rs"

[dependencies]
lorisse-store = { path = "../store" }
lorisse-guard = { path = "../guard" }
