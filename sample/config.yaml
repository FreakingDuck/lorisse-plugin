# The sample memory folder's settings: every word of the folder is invented, made for the checks.
kinds: [fact, decision, preference, idea, need]
memory_statuses: [raw, sorted, retired]
task_statuses: [todo, in-progress, waiting, done, retired]
priorities: [high, medium, low]
categories: [home, garden, admin]
sources: [phone, chat, agent, console, app]
person_sections: [What I know, How I handle]
# Three repositories read as one memory: the root, named home, the club, numbered on its own, and
# the office, confidential and open to Claude, numbered on its own.
repos:
  - { name: home, folder: . }
  - { name: club, folder: club, prefix: C }
  - { name: office, folder: office, role: work, confidential: true, providers: [anthropic], prefix: O }
