# Tests the workspace, then builds the program of crates/tools for a Mac (both Apple chips
# and Intel, one file) and for Windows, and commits the two programs to plugin/server/ when
# they changed. A plugin installed from GitHub carries only the files of the repository, so
# the built programs live in it; this recipe is what makes them, from the source alone.
name: build

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "sample/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: The compiler (the store needs Rust 1.85 or newer)
        run: rustc --version
      - name: Add the two Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log
      - name: Say which tests failed
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$|panicked at|^ +left:|^ +right:|^error: test failed" test.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Build for Apple silicon
        run: cargo build --release --locked -p lorisse --target aarch64-apple-darwin
      - name: Build for Intel
        run: cargo build --release --locked -p lorisse --target x86_64-apple-darwin
      - name: Join both into one program
        run: |
          mkdir -p out
          lipo -create -output out/lorisse \
            target/aarch64-apple-darwin/release/lorisse \
            target/x86_64-apple-darwin/release/lorisse
          lipo -info out/lorisse
      - uses: actions/upload-artifact@v4
        with:
          name: lorisse-mac
          path: out/lorisse
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: The compiler (the store needs Rust 1.85 or newer)
        run: rustc --version
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log
      - name: Say which tests failed
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$|panicked at|^ +left:|^ +right:|^error: test failed" test.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Build
        run: cargo build --release --locked -p lorisse
      - uses: actions/upload-artifact@v4
        with:
          name: lorisse-windows
          path: target/release/lorisse.exe
          if-no-files-found: error

  commit:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: lorisse-mac
          path: plugin/server
      - uses: actions/download-artifact@v4
        with:
          name: lorisse-windows
          path: plugin/server
      - name: Commit the two programs when they changed
        run: |
          chmod +x plugin/server/lorisse
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/server/lorisse plugin/server/lorisse.exe
          git update-index --chmod=+x plugin/server/lorisse
          if git diff --cached --quiet; then
            echo "The programs did not change."
            exit 0
          fi
          git commit -m "the programs built from ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main
